# Self-contained stack: `cp .env.example .env && docker compose up -d`
# On the shared VPS add the override: -f docker-compose.yml -f docker-compose.vps.yml
name: b24hub

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=40
      - -c
      - log_min_duration_statement=500
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot migration runner: applies sql/*.sql in order, tracks them in schema_migrations.
  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      RO_DB_USER: ${RO_DB_USER:-b24hub_ro}
      RO_DB_PASSWORD: ${RO_DB_PASSWORD:-change-me-ro}
    volumes:
      - ./sql:/sql:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"

  # Optional dashboard: `docker compose --profile dashboard up -d grafana`, then http://127.0.0.1:3000
  # (on a server: ssh -L 3000:127.0.0.1:3000 <host>). Reads Postgres with the read-only role.
  grafana:
    image: grafana/grafana-oss:11.2.2
    profiles: [dashboard]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # bound to 127.0.0.1 and backed by a read-only role: anonymous users may view, not edit
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/b24hub.json
      PG_DB: ${POSTGRES_DB}
      RO_DB_USER: ${RO_DB_USER:-b24hub_ro}
      RO_DB_PASSWORD: ${RO_DB_PASSWORD:-change-me-ro}
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana

volumes:
  pgdata:
  grafana:
